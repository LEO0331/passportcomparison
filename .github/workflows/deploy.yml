name: Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build Web
        run: flutter build web --release --base-href "/passportcomparison/" --no-web-resources-cdn

      - name: Generate AssetManifest.json compatibility file
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const assetsDir = path.join(process.cwd(), 'build', 'web', 'assets');
          const outFile = path.join(assetsDir, 'AssetManifest.json');
          const manifest = {};

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath);
                continue;
              }
              if (entry.name === 'AssetManifest.bin' || entry.name === 'AssetManifest.bin.json' || entry.name === 'AssetManifest.json') {
                continue;
              }
              const relative = path.relative(assetsDir, fullPath).replaceAll(path.sep, '/');
              manifest[relative] = [relative];
            }
          }

          walk(assetsDir);
          fs.writeFileSync(outFile, JSON.stringify(manifest));
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
